<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>AI Log Analyzer</title>
</head>
<body>

    <div class="container mt-5">

        <div class="card shadow">
            <div class="card-body">

                <h1 class="text-primary">
                    Aditya's AI Log Analyzer
                </h1>

                <p class="lead">
                    Upload logs and analyze errors automatically.
                </p>

            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">

                <h3>Features</h3>

                <ul>
                    <li>Upload log file</li>
                    <li>Analyze errors</li>
                    <li>Generate summary</li>
                </ul>

            </div>
        </div>
        <div class="card mt-3">
            <div class="card-body">

                <h3>Upload Log File</h3>

                <form action="/upload" method="POST" enctype="multipart/form-data">

                    <input type="file"
                        name="logfile"
                        class="form-control">

                    <button type="submit"
                            class="btn btn-primary mt-3">
                        Upload
                    </button>

                </form>
            </div>
        </div>
        <a href="/history" class="btn btn-info mt-3">
            View Analysis History
        </a>
    </div>


</body>
</html>
